name: Deploy CM5 demo

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-demo-cm5.yml"
      - "apps/demo-cm5/**"
      - "packages/codemirror-helix-cm5/**"
      - "packages/codemirror-helix-core/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build --workspace=codemirror-helix-core
      - run: npm run build --workspace=codemirror-helix-cm5
      - run: npm run build --workspace=codemirror-helix-cm5-playground
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/demo-cm5/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
